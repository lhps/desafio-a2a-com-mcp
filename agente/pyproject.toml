[project]
name = "central-de-salas-agente"
version = "1.0.0"
description = "Agente A2A v1.0 (JSON-RPC) que e host MCP do servidor de salas"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agente"]
